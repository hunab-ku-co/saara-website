<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout extend under notches/home indicators
         on iOS; the safe-area insets in index.css keep content clear of them. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b288b" />

    <title>Saara Kiventoyry</title>
    <meta
      name="description"
      content="Saara Kiventoyry — Kokoomuksen ehdokas. Tutustu teemoihin ja ota yhteyttä."
    />
    <!-- Rewritten per route by usePageMeta; these are the fallbacks a crawler
         sees before JavaScript runs. -->
    <link rel="canonical" href="https://saarakiventoyry.fi/" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fi_FI" />
    <meta property="og:site_name" content="Saara Kiventoyry" />
    <meta property="og:title" content="Saara Kiventoyry" />
    <meta
      property="og:description"
      content="Saara Kiventoyry — Kokoomuksen ehdokas. Tutustu teemoihin ja ota yhteyttä."
    />
    <meta property="og:url" content="https://saarakiventoyry.fi/" />
    <meta property="og:image" content="https://saarakiventoyry.fi/img/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Saara Kiventoyry" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
