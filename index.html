<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover lets the layout extend under notches/home indicators
         on iOS; the safe-area insets in index.css keep content clear of them. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f1216" />

    <title>Saara</title>
    <meta
      name="description"
      content="Saara — cloud foundations, infrastructure as code, and delivery pipelines."
    />
    <!-- Rewritten per route by usePageMeta; these are the fallbacks a crawler
         sees before JavaScript runs. -->
    <link rel="canonical" href="https://saarakiventoyry.fi/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saara" />
    <meta property="og:title" content="Saara" />
    <meta
      property="og:description"
      content="Saara — cloud foundations, infrastructure as code, and delivery pipelines."
    />
    <meta property="og:url" content="https://saarakiventoyry.fi/" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
